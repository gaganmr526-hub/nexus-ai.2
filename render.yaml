databases:
  - name: nexustrace-db
    databaseName: nexustrace
    user: nexustrace
    plan: free
    region: oregon

services:
  - type: web
    name: nexustrace-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/seed_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexustrace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
